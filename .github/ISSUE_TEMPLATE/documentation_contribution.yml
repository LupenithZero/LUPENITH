name: Documentation or research contribution
description: Propose a guide, translation, source review, or documentation improvement
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Contribution type
      options:
        - New guide
        - Source or fact-check
        - Translation
        - Accessibility or plain-language edit
        - Navigation or formatting
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you want to contribute?
      description: Explain the audience, scope, and expected result.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources and references
      description: Link original sources where relevant.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I will not include confidential or personal information.
          required: true
        - label: I have the right to contribute this material under the proposed license.
          required: true
